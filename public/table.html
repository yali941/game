<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f3ed"><title>一局 · 好友棋室</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/table.css"><link rel="stylesheet" href="/tabletop.css"><script type="module" src="/table-app.js"></script></head>
<body><header class="club-header"><a class="club-brand" href="/">● 一局<span>○</span><small>PLAY TOGETHER</small></a><div class="header-links"><a id="hall-link" href="/">← 游戏大厅</a><button id="rules-button" class="text-button">玩法说明 ?</button></div></header>
<main class="table-main"><section class="table-intro"><div><p class="overline" id="game-eyebrow"></p><h1 id="game-title"></h1><p id="game-subtitle"></p></div><span class="no-timer">∞ <small>行棋不限时</small></span></section>
<div class="table-layout"><section class="table-board"><div class="table-board-top"><span id="board-label">棋盘已备好</span><span id="board-turn"></span></div><div id="board-wrap"><svg id="table-svg" role="group"></svg><div id="table-effects" aria-hidden="true"></div></div><div class="table-board-bottom"><span id="board-help">邀请朋友，开始这一局。</span><span id="round-label"></span></div></section>
<aside class="table-sidebar"><div class="mode-tabs"><button id="online-tab" class="selected" aria-pressed="true">好友联机</button><button id="local-tab" aria-pressed="false">同屏对弈</button></div>
<section class="club-panel" id="lobby"><p class="overline">01 / 邀请入座</p><h2>好棋，等一个对手。</h2><label id="count-field" class="field-label" for="player-count">参与人数<select id="player-count"><option value="2">2 人对弈</option><option value="3">3 人同行</option><option value="4">4 人同乐</option></select></label><button id="create-button" class="primary">创建房间 ↗</button><div class="or-divider">或加入好友的房间</div><form id="join-form" class="join-row"><input id="room-input" aria-label="6 位房间码" placeholder="输入 6 位房间码" maxlength="6" autocomplete="off" required pattern="[A-Za-z2-9]{6}"><button aria-label="加入房间" id="join-button">→</button></form></section>
<section class="club-panel" id="room-panel" hidden><p class="overline">01 / 我的棋室</p><strong class="room-code" id="room-code"></strong><button class="secondary" id="copy-button">复制邀请链接 ↗</button><p id="room-note" class="small-note"></p></section>
<section class="club-panel"><p class="overline">02 / 此刻棋局 <span id="connection">未入座</span></p><div id="players" class="table-players"></div><div class="turn-box" aria-live="polite"><strong id="status-title">棋盘已备好</strong><p id="status-detail">邀请朋友，开始这一局。</p></div><button class="primary" id="start-button" hidden>人齐了，开始游戏</button><div id="flight-controls" hidden><div class="dice-row"><span id="dice" aria-label="尚未掷骰">⚄</span><button id="roll-button" class="primary">掷骰子</button></div><div id="plane-options"></div></div><button id="rematch-button" class="primary" hidden>再来一局 ↻</button><div class="small-actions" id="game-actions" hidden><button class="text-button" id="resign-button">认输</button><button class="text-button" id="leave-button">离开棋室 ↗</button></div></section>
<section class="club-panel" id="reactions-panel" hidden><p class="overline">03 / 和朋友打个招呼</p><div class="reaction-buttons"><button data-reaction="poop" aria-label="扔大便">💩<small>扔大便</small></button><button data-reaction="heart" aria-label="送爱心">❤️<small>送爱心</small></button><button data-reaction="cry" aria-label="哭哭脸">😭<small>哭哭脸</small></button><button data-reaction="bomb" aria-label="扔炸弹">💣<small>扔炸弹</small></button></div><p id="reaction-feedback" class="small-note" aria-live="polite">小小互动，不影响棋局</p></section>
<section class="club-panel ranking-panel" data-rank-kind=""><p class="overline">04 / 联机胜场榜</p><div class="nickname-row"><input id="nickname" aria-label="玩家昵称" maxlength="24" placeholder="你的昵称"><button id="save-nickname">保存</button></div><p id="my-wins" class="small-note">正在读取战绩…</p><ol id="rank-list" class="rank-list"></ol><p id="rank-status" class="small-note" aria-live="polite"></p><p class="rank-footnote">仅统计有行棋的联机胜局，同屏不计。此免费服务器重启或更新后，战绩可能重置。</p></section>
</aside></div></main><footer class="club-footer">一局 · 不赶时间，只管好好玩。</footer>
<div id="toast" role="status" hidden></div><dialog id="rules-dialog"><button class="dialog-close" aria-label="关闭玩法说明">×</button><p class="overline">THE SIMPLE RULES</p><h2 id="rules-title"></h2><div id="rules-content"></div></dialog><dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button class="secondary" id="confirm-cancel">继续游戏</button><button class="primary" id="confirm-ok">确定</button></div></dialog><dialog id="share-dialog"><button class="dialog-close" aria-label="关闭邀请链接">×</button><h2>邀请朋友入座</h2><label for="share-url">复制下面的邀请链接</label><input id="share-url" readonly></dialog>
</body></html>
